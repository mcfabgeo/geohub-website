name: Apply home cloud link

on:
  push:
    branches:
      - agent/cloud-gestito-studi
    paths:
      - .github/workflows/apply-home-cloud-link.yml

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-gestito-studi
      - name: Update navigation and footer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          nav_anchor = '        <a href="#comune">Per il Comune</a>\n'
          cloud_link = '        <a href="cloud-studi.html">Cloud per studi</a>\n'
          if cloud_link not in text:
              if nav_anchor not in text:
                  raise SystemExit('Navigation anchor not found')
              text = text.replace(nav_anchor, nav_anchor + cloud_link, 1)

          capital = 'REA FI-712302 — Capitale sociale € 2.500,00 interamente versato —\n      PEC:'
          replacement = 'REA FI-712302 —\n      PEC:'
          if capital in text:
              text = text.replace(capital, replacement, 1)
          elif 'Capitale sociale' in text:
              raise SystemExit('Capital wording found in an unexpected format')

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-home-cloud-link.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-home-cloud-link.yml
          git commit -m "Collega Cloud Studio e rimuove capitale sociale"
          git push
