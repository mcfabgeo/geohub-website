name: Update infrastructure navigation

on:
  push:
    branches:
      - agent/infrastrutture-digitali
    paths:
      - .github/workflows/update-infra-nav.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/infrastrutture-digitali
      - name: Rename navigation item
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<a href="cloud-studi.html">Cloud per studi</a>'
          new = '<a href="cloud-studi.html">Infrastrutture digitali</a>'
          if old not in text:
              raise SystemExit('Navigation label not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/update-infra-nav.yml').unlink()
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-infra-nav.yml
          git commit -m "Rinomina voce infrastrutture digitali"
          git push
